<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameXD | Penalty Kick</title>

    <link rel="stylesheet" href="css/penalty.css">
</head>
<body>

<div class="game">

    <h1>⚽ Penalty Kick</h1>

    <div class="scoreboard">
        <span>Score: <b id="score">0</b></span>
        <span>Lives: <b id="lives">3</b></span>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="message"></div>

    <p>Click anywhere inside the goal to shoot!</p>

    <button id="restartBtn" style="display:none;">
        Play Again
    </button>

</div>

<script src="js/penalty.js"></script>

</body>
</html>
