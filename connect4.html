
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connect Four | GameXD</title>

    <link
        rel="stylesheet"
        href="css/connect4.css"
    >

    <script
        type="module"
        src="./js/connect4.js"
        defer
    ></script>

</head>


<body>

    <div class="background"></div>


    <!-- =========================
         NAVBAR
    ========================== -->

    <div class="navbar">

        <h2
            onclick="location.href='home.html'"
            style="cursor:pointer;"
        >
            🎮 GameXD
        </h2>


        <div class="right">

            <span id="userName">
                Loading...
            </span>

            <span id="userPoints">
                | ⭐ 0 pts
            </span>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </div>


    <!-- =========================
         GAME CONTAINER
    ========================== -->

    <div class="container">

        <h1>
            Connect Four
        </h1>


        <!-- =========================
             GAME MODE
        ========================== -->

        <div class="modeBox">

            <label for="gameMode">
                Game Mode:
            </label>

            <select id="gameMode">

                <option value="ai">
                    🤖 Vs AI
                </option>

                <option value="local">
                    👥 2 Players
                </option>

            </select>

        </div>


        <!-- =========================
             LOCAL PLAYER SETUP
        ========================== -->

        <div
            id="playerSetup"
            class="playerSetup"
            style="display:none;"
        >

            <div class="nameInput">

                <label for="player1Name">
                    🔴 Player 1
                </label>

                <input
                    type="text"
                    id="player1Name"
                    placeholder="Player 1"
                    maxlength="15"
                >

            </div>


            <div class="nameInput">

                <label for="player2Name">
                    🟡 Player 2
                </label>

                <input
                    type="text"
                    id="player2Name"
                    placeholder="Player 2"
                    maxlength="15"
                >

            </div>

        </div>


        <!-- =========================
             SCOREBOARD
        ========================== -->

        <div
            id="scoreboard"
            class="scoreboard"
            style="display:none;"
        >

            <div class="playerScore redScore">

                <div
                    id="displayPlayer1"
                    class="playerName"
                >
                    Player 1
                </div>

                <div
                    id="player1Score"
                    class="score"
                >
                    0
                </div>

            </div>


            <div class="scoreDivider">
                :
            </div>


            <div class="playerScore yellowScore">

                <div
                    id="displayPlayer2"
                    class="playerName"
                >
                    Player 2
                </div>

                <div
                    id="player2Score"
                    class="score"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             STATUS
        ========================== -->

        <p id="status">
            Your Turn 🔴
        </p>


        <!-- =========================
             BOARD
        ========================== -->

        <div
            id="board"
            class="board"
        ></div>


        <!-- =========================
             BUTTONS
        ========================== -->

        <div class="buttons">

            <button id="restartBtn">
                🔄 Restart
            </button>


            <button
                id="resetScoreBtn"
                style="display:none;"
            >
                🧹 Reset Score
            </button>


            <button
                onclick="location.href='home.html'"
            >
                🏠 Home
            </button>

        </div>

    </div>

</body>

</html>
